# Builds the plugin on every push and pull request, checks that the plugin's copies of the web scripts
# match web/, runs the automatic permission check against a throwaway Jellyfin, and on a version tag
# (v0.1.0.18) publishes the release zip.
name: Build and check

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT";
          else echo "version=0.0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"; fi
      - name: Build and package
        run: ./build.sh "${{ steps.v.outputs.version }}" "Jelly Cinema ${{ steps.v.outputs.version }}"
      - name: Plugin copies of the web scripts are up to date
        run: |
          git diff --exit-code -- plugin/Jellyfin.Plugin.JellyCinema/Web || {
            echo "::error::plugin/Jellyfin.Plugin.JellyCinema/Web is out of date: run ./build.sh and commit the copied scripts"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: jellycinema-plugin-${{ steps.v.outputs.version }}
          path: dist/

  permission-check:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        jellyfin: ['12.1', '12.2', '12.3']   # the oldest supported version and the newer ones people run
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          cd tests && npm install --no-save --silent playwright@1.64.1 && npx playwright install --with-deps chromium
      - name: Permission check (no one sees titles they can't open)
        run: tests/run.sh jellyfin/jellyfin:${{ matrix.jellyfin }}
      - name: Jellyfin log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jellyfin-log-${{ matrix.jellyfin }}
          path: tests/.work/jellyfin.log

  release:
    needs: [build, permission-check]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Version and release notes
        id: v
        run: |
          V="${GITHUB_REF#refs/tags/v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          python3 - "$V" > release-notes.md <<'PY'
          import re, sys
          v = sys.argv[1]
          t = open('CHANGELOG.md', encoding='utf-8').read()
          m = re.search(r'^## +v?' + re.escape(v) + r'\b[^\n]*\n(.*?)(?=^## |\Z)', t, re.S | re.M)
          print((m.group(1).strip() if m else 'Jelly Cinema ' + v) + '\n\nInstall: add the plugin catalog in Dashboard > Plugins > Repositories (see the README).')
          PY
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body_path: release-notes.md
      - name: Update the plugin catalog (branch "catalog", manifest.json)
        env:
          JC_RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/main
        run: |
          V="${{ steps.v.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin catalog >/dev/null; then
            git fetch -q origin catalog && git worktree add -q -B catalog cat origin/catalog
          else
            git worktree add -q --orphan -b catalog cat
          fi
          python3 tools/make-manifest.py cat/manifest.json "$V" "dist/jellycinema-plugin-$V.zip" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/v$V/jellycinema-plugin-$V.zip" CHANGELOG.md
          cd cat && git add manifest.json && git commit -q -m "Catalog: Jelly Cinema $V" && git push -q origin catalog
